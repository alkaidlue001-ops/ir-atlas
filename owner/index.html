<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alkaid · 本机管理</title><link rel="stylesheet" href="/admin/style.css"><body><header><a href="/">← 网站预览</a><h1>内容管理</h1><p>保存后刷新网站即可查看。公开网站不提供编辑和评论功能。</p></header><main><p id="message" role="status"></p><form id="login"><h2 id="loginTitle">登录</h2><label>管理密码<input id="password" type="password" autocomplete="current-password" required maxlength="256"></label><p id="setupNote" hidden>首次使用，请设置至少12个字符的密码。密码只保存在本机，不随网站发布。</p><button type="submit">继续</button></form><form id="editor" hidden><div class="actions"><button type="submit">保存修改</button><button id="logout" type="button">退出登录</button></div><section><h2>个人介绍</h2><label>显示名称<input id="name"></label><label>简介<textarea id="intro"></textarea></label><label>个人照片路径或 HTTPS 链接<input id="portrait" placeholder="assets/my-photo.jpg"></label><p>本页不收集邮箱。学校与交流经历在 profile.js 中维护；请仅填写愿意公开的内容。</p></section><section><h2>文献与人物</h2><label>选择条目<select id="node"></select></label><label>代表作<input id="book"></label><label>文献链接<input id="url" type="url"></label><label>简介<textarea id="nodeIntro"></textarea></label><label>核心命题<textarea id="claim"></textarea></label><label>导读 · 中文<textarea id="guide-zh" class="long"></textarea></label><label>Reading guide · English<textarea id="guide-en"></textarea></label><label>日本語<textarea id="guide-ja"></textarea></label><label>한국어<textarea id="guide-ko"></textarea></label></section><section><h2>写作 · 第1至第4章</h2><label>作品名<input id="workTitle"></label><label>副标题<input id="subtitle"></label><label>公开简介<textarea id="description"></textarea></label><div id="chapters"></div></section><section><h2>音乐</h2><label class="check"><input id="musicEnabled" type="checkbox">显示音乐入口</label><label>Spotify 专辑链接<input id="album"></label><label>专辑名称<input id="musicTitle"></label><label>歌手<input id="artist"></label><p>使用官方播放器；播放范围取决于 Spotify、登录状态和地区。</p></section><button type="submit">保存修改</button></form></main><script src="/admin/app.js"></script></body></html>
